<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Sterowanie Domem</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root{--bg:#0d1117;--card:#161b22;--text:#e6edf3;--prim:#00d4ff;--on:#39ff8c;--off:#ff4757;--t:all .35s ease;}
  body.night-mode{--bg:#000;--card:#0d0d0f;--text:#666;--prim:#ff3366;--on:#08f8a0;--off:#ff3366;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:15px;transition:var(--t);}
  .theme{position:fixed;top:15px;right:15px;z-index:99;width:50px;height:50px;background:#222;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .theme i{font-size:1.5rem;color:var(--prim);}
  h1{text-align:center;margin:20px 0 30px;font-size:2.5rem;background:linear-gradient(90deg,var(--prim),var(--on));-webkit-background-clip:text;color:transparent;}
  .tabs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:30px;}
  .tab{padding:12px 24px;background:var(--card);border-radius:12px;cursor:pointer;font-weight:600;transition:var(--t);}
  .tab.active{background:linear-gradient(45deg,var(--prim),var(--on));color:#000;}
  .room{display:none;}
  .room.active{display:block;}
  .grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;}
  .card{background:var(--card);border-radius:16px;padding:24px;text-align:center;box-shadow:0 8px 25px rgba(0,0,0,.5);transition:var(--t);}
  .card:hover{transform:translateY(-8px);}
  .card i{font-size:3rem;margin-bottom:12px;background:linear-gradient(45deg,var(--prim),var(--on));-webkit-background-clip:text;color:transparent;}
  .status{font-size:1.4rem;font-weight:bold;padding:10px 20px;border-radius:50px;margin:15px 0;}
  .status.on{background:#39ff8c22;color:var(--on);box-shadow:0 0 20px #39ff8c44;}
  .status.off{background:#ff475722;color:var(--off);}
  button{width:100%;padding:16px;border:none;border-radius:12px;font-size:1.2rem;font-weight:bold;cursor:pointer;transition:var(--t);}
  button.on{background:linear-gradient(45deg,#10b981,#34d399);box-shadow:0 0 25px #34d39966;}
  button.off{background:#334155;}
  button:hover{transform:scale(1.05);}
  .allbtn{margin:40px auto;display:block;padding:18px 40px;background:linear-gradient(45deg,#8b5cf6,#ec4899);color:#000;font-size:1.3rem;min-width:280px;border-radius:14px;}
  .allbtn.on{background:linear-gradient(45deg,#ef4444,#f87171);}
  @keyframes p{0%{box-shadow:0 0 0 rgba(57,255,140,0);}50%{box-shadow:0 0 50px rgba(57,255,140,.9);transform:scale(1.05);}100%{box-shadow:0 0 20px rgba(57,255,140,.4);}}
  .card.on{animation:p .6s;}
</style>
</head>
<body>

<div class="theme" id="theme"><i class="fas fa-moon"></i></div>
<h1>Sterowanie Domem</h1>

<div class="tabs">
  <div class="tab active" data-r="biurko">Biurko</div>
  <div class="tab" data-r="pracownia">Pracownia</div>
  <div class="tab" data-r="pokoj">Pokój</div>
  <div class="tab" data-r="salon">Salon</div>
</div>

<div id="biurko" class="room active"><div class="grid" id="g0"></div><button class="allbtn" id="a0">WŁĄCZ WSZYSTKO</button></div>
<div id="pracownia" class="room"><div class="grid" id="g1"></div><button class="allbtn" id="a1">WŁĄCZ WSZYSTKO</button></div>
<div id="pokoj" class="room"><div class="grid" id="g2"></div><button class="allbtn" id="a2">WŁĄCZ WSZYSTKO</button></div>
<div id="salon" class="room"><div class="grid" id="g3"></div><button class="allbtn" id="a3">WŁĄCZ WSZYSTKO</button></div>

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
<script>
// Tryb nocny
document.getElementById('theme').onclick = () => {
  document.body.classList.toggle('night-mode');
  const icon = document.body.classList.contains('night-mode') ? 'sun' : 'moon';
  document.querySelector('#theme i').className = `fas fa-${icon}`;
  localStorage.setItem('nightMode', document.body.classList.contains('night-mode'));
};
if (localStorage.getItem('nightMode')==='true') document.body.classList.add('night-mode');

// Firebase
firebase.initializeApp({
  apiKey: "AIzaSyDykM2omZ68HY7EEJjPiG16jXbPGW0bYSA",
  authDomain: "domek-52b6a.firebaseapp.com",
  databaseURL: "https://domek-52b6a-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "domek-52b6a"
});
const db = firebase.database();

// MIGRACJA + INICJALIZACJA – raz na zawsze
async function initDB() {
  for (let i = 0; i <= 15; i++) {
    const snap = await db.ref(`relay${i}`).once('value');
    if (snap.val() === null) {
      await db.ref(`relay${i}`).set(false);
    }
    // migracja starych b0-b3 → relay0-relay3
    const old = await db.ref(`b${i}`).once('value');
    if (old.exists() && i <= 3) {
      const state = old.child('state').val();
      if (typeof state === 'boolean') await db.ref(`relay${i}`).set(state);
    }
  }
}
initDB();

// Konfiguracja pomieszczeń
const config = [
  {name:"biurko",    start:0,  lights:3, sockets:1 },
  {name:"pracownia",start:4,  lights:3, sockets:3 },
  {name:"pokoj",    start:7,  lights:3, sockets:3 },
  {name:"salon",    start:10, lights:3, sockets:3 }
];

config.forEach((room, roomIdx) => {
  const container = document.getElementById('g'+roomIdx);
  const allBtn = document.getElementById('a'+roomIdx);
  const states = [];

  for (let i = 0; i < room.lights + room.sockets; i++) {
    const idx = room.start + i;
    const isLight = i < room.lights;
    const title = isLight 
      ? (i===0?"Lewe":i===1?"Środkowe":i===2?"Prawe":"Światło "+(i+1))
      : "Gniazdko "+(i-room.lights+1);

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<i class="fas fa-${isLight?'lightbulb':'plug'}"></i><h2>${title}</h2><div class="status" id="s${idx}">–</div><button id="b${idx}">–</button>`;
    container.appendChild(card);

    const status = document.getElementById('s'+idx);
    const btn = document.getElementById('b'+idx);
    const ref = db.ref('relay'+idx);

    ref.on('value', s => {
      const on = s.val() === true;
      states[i] = on;
      status.textContent = on?"ON":"OFF";
      status.className = "status " + (on?"on":"off");
      btn.textContent = on?"WYŁĄCZ":"WŁĄCZ";
      btn.className = on?"on":"off";
      if (on) card.classList.add('on');
      // update all button
      const allOn = states.every(x => x);
      allBtn.textContent = allOn ? "WYŁĄCZ WSZYSTKO" : "WŁĄCZ WSZYSTKO";
      allBtn.classList.toggle('on', allOn);
    });

    btn.onclick = () => ref.set(!states[i]);
  }

  allBtn.onclick = () => {
    const target = states.every(x => x) ? false : true;
    for (let i = 0; i < states.length; i++) {
      db.ref('relay'+(room.start+i)).set(target);
    }
  };
});

// Przełączanie zakładek
document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab,.room').forEach(e => e.classList.remove('active'));
    t.classList.add('active');
    document.getElementById(t.dataset.r).classList.add('active');
  };
});
</script>
</body>
</html>
