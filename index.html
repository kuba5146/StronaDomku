<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Sterowanie oświetleniem biurka</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root {
      --bg: #0f1116;
      --card: #1a1d24;
      --text: #e0e0e0;
      --text-muted: #888;
      --primary: #00d4ff;
      --success: #00ff88;
      --danger: #ff3b30;
      --off: #f87171;
      --on: #34d399;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
      --glow: 0 0 20px rgba(0,212,255,0.4);
      --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* === TRYB NOCNY === */
    body.night-mode {
      --bg: #050507;
      --card: #0e0e12;
      --text: #555;
      --text-muted: #333;
      --primary: #ff2e63;
      --success: #08f8a0;
      --on: #08f8a0;
      --off: #ff3366;
      --glow: 0 0 15px rgba(255,46,99,0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg) 0%, #1a1d2e 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 10px;
      position: relative;
      transition: var(--transition);
      overflow-x: hidden;
    }

    /* Przełącznik trybu nocnego */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      background: rgba(30,30,40,0.8);
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .theme-toggle:hover { transform: scale(1.1); }
    .theme-toggle i { font-size: 1.5rem; color: var(--primary); transition: var(--transition); }

    h1 {
      font-size: 2.5rem;
      background: linear-gradient(90deg, var(--primary), var(--success));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-align: center;
      margin: 30px 0 50px;
      text-shadow: 0 0 30px rgba(0,212,255,0.5);
      transition: var(--transition);
    }

    #loginForm {
      max-width: 420px;
      margin: 60px auto;
      background: var(--card);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: var(--shadow), var(--glow);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0,212,255,0.2);
      transition: var(--transition);
    }
    #loginForm input {
      width: 100%;
      padding: 14px 18px;
      margin: 12px 0 20px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(0,212,255,0.3);
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      transition: var(--transition);
    }
    #loginForm input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(0,212,255,0.5);
    }
    #loginForm button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(45deg, var(--primary), var(--success));
      color: black;
      font-weight: bold;
      font-size: 1.1rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 15px rgba(0,212,255,0.4);
    }
    #loginForm button:hover { transform: translateY(-3px); }

    #dashboard { display: none; }

    .relay-container {
      max-width: 1100px;
      margin: 0 auto 30px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
      padding: 0 10px;
    }

    .relay-card {
      background: var(--card);
      border-radius: 24px;
      padding: 28px;
      text-align: center;
      box-shadow: var(--shadow);
      border: 1px solid rgba(0,212,255,0.15);
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }
    .relay-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), var(--glow);
    }

    @keyframes pulseOn {
      0%   { box-shadow: var(--shadow), 0 0 0 rgba(52,211,153,0); transform: scale(1); }
      50%  { box-shadow: var(--shadow), 0 0 50px rgba(52,211,153,0.8); transform: scale(1.05); }
      100% { box-shadow: var(--shadow), 0 0 20px rgba(52,211,153,0.4); transform: scale(1); }
    }
    @keyframes pulseOff {
      0%   { box-shadow: var(--shadow), 0 0 50px rgba(248,113,113,0.6); }
      100% { box-shadow: var(--shadow); }
    }
    .relay-card.turning-on { animation: pulseOn 0.8s ease-out; }
    .relay-card.turning-off { animation: pulseOff 0.6s ease-out; }

    .relay-card i {
      font-size: 3.2rem;
      margin-bottom: 16px;
      background: linear-gradient(45deg, var(--primary), var(--success));
      -webkit-background-clip: text;
      color: transparent;
      transition: var(--transition);
    }

    .status {
      font-size: 1.4rem;
      font-weight: bold;
      padding: 10px 20px;
      border-radius: 50px;
      min-width: 110px;
      transition: var(--transition);
    }
    .status.on  { background: rgba(52,211,153,0.2); color: var(--on); box-shadow: 0 0 20px rgba(52,211,153,0.4); }
    .status.off { background: rgba(248,113,113,0.2); color: var(--off); }

    .relay-card button {
      width: 100%;
      padding: 18px;
      margin-top: 18px;
      border: none;
      border-radius: 16px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      transition: var(--transition);
    }
    .relay-card button.on  { background: linear-gradient(45deg, #10b981, #34d399); box-shadow: 0 0 25px rgba(52,211,153,0.6); }
    .relay-card button.off { background: linear-gradient(45deg, #64748b, #94a3b8); }
    .relay-card button:hover { transform: scale(1.05); }

    .global-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      margin: 30px 0;
    }
    .global-buttons button {
      padding: 14px 30px;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: var(--transition);
      min-width: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    #allToggleBtn {
      background: linear-gradient(45deg, #8b5cf6, #ec4899);
      box-shadow: 0 0 25px rgba(139,92,246,0.5);
    }
    #allToggleBtn.all-on {
      background: linear-gradient(45deg, #ef4444, #f87171);
      box-shadow: 0 0 25px rgba(239,68,68,0.6);
    }
    #logoutBtn { background: #374151; color: white; }
    .global-buttons button:hover { transform: translateY(-5px) scale(1.03); }

    footer { text-align: center; padding: 30px; color: #444; font-size: 0.9rem; transition: var(--transition); }

    @media (max-width: 600px) {
      h1 { font-size: 2rem; }
      .global-buttons { flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>

  <!-- Przełącznik trybu nocnego -->
  <div class="theme-toggle" id="themeToggle">
    <i class="fas fa-moon"></i>
  </div>

  <h1>Oświetlenie biurka</h1>

  <!-- Login -->
  <div id="loginForm">
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Hasło" required />
    <button id="loginBtn">ZALOGUJ</button>
  </div>

  <!-- Dashboard -->
  <div id="dashboard">
    <div class="relay-container">
      <div class="relay-card" data-relay="1">
        <i class="fas fa-lightbulb"></i>
        <h2>Światło lewe</h2>
        <div class="status" id="status1">Loading...</div>
        <button id="btn1">Ładowanie...</button>
      </div>
      <div class="relay-card" data-relay="2">
        <i class="fas fa-lightbulb"></i>
        <h2>Światło środkowe</h2>
        <div class="status" id="status2">Loading...</div>
        <button id="btn2">Ładowanie...</button>
      </div>
      <div class="relay-card" data-relay="3">
        <i class="fas fa-lightbulb"></i>
        <h2>Światło prawe</h2>
        <div class="status" id="status3">Loading...</div>
        <button id="btn3">Ładowanie...</button>
      </div>
      <div class="relay-card" data-relay="4">
        <i class="fas fa-plug"></i>
        <h2>Gniazdka</h2>
        <div class="status" id="status4">Loading...</div>
        <button id="btn4">Ładowanie...</button>
      </div>
    </div>

    <div class="global-buttons">
      <button id="allToggleBtn"><i class="fas fa-bolt"></i> <span>Sprawdzanie...</span></button>
      <button id="logoutBtn">Wyloguj</button>
    </div>
  </div>

  <footer>Podjebka od Tech StudyCell © 2025</footer>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script>
    // === TRYB NOCNY ===
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;
    if (localStorage.getItem('nightMode') === 'true') {
      body.classList.add('night-mode');
      themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
    }
    themeToggle.addEventListener('click', () => {
      body.classList.toggle('night-mode');
      const isNight = body.classList.contains('night-mode');
      themeToggle.innerHTML = isNight ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
      localStorage.setItem('nightMode', isNight);
    });

    // === FIREBASE & LOGOWANIE ===
    const firebaseConfig = {
      apiKey: "AIzaSyDykM2omZ68HY7EEJjPiG16jXbPGW0bYSA",
      authDomain: "domek-52b6a.firebaseapp.com",
      databaseURL: "https://domek-52b6a-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "domek-52b6a",
      storageBucket: "domek-52b6a.firebasestorage.app",
      messagingSenderId: "641050671936",
      appId: "1:641050671936:web:47d40c3fa12f39962c98a5"
    };
    firebase.initializeApp(firebaseConfig);

    const allowedEmail = "joszrank@gmail.com";
    const allowedPassword = "LotyWChmurach";
    const loginForm = document.getElementById("loginForm");
    const dashboard = document.getElementById("dashboard");
    const allToggleBtn = document.getElementById("allToggleBtn");
    const allToggleText = allToggleBtn.querySelector("span");

    document.getElementById("loginBtn").addEventListener("click", () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      if (!email || !password) return alert("Wpisz email i hasło!");
      if (email === allowedEmail && password === allowedPassword) {
        firebase.auth().signInWithEmailAndPassword(email, password)
          .then(() => {
            loginForm.style.display = "none";
            dashboard.style.display = "block";
            startRelayControl();
          })
          .catch(err => alert("Błąd logowania: " + err.message));
      } else {
        alert("Zły email lub hasło!");
      }
    });

    function startRelayControl() {
      const db = firebase.database();
      const relays = [{id:1,path:"b0"}, {id:2,path:"b1"}, {id:3,path:"b2"}, {id:4,path:"b3"}];
      const cards = document.querySelectorAll('.relay-card');
      let allStates = [false,false,false,false];

      relays.forEach((r, i) => {
        const statusEl = document.getElementById(`status${r.id}`);
        const btn = document.getElementById(`btn${r.id}`);
        const card = cards[i];
        const ref = db.ref("/" + r.path);

        ref.on("value", snap => {
          const newState = snap.val() === true;
          const oldState = allStates[i];
          allStates[i] = newState;

          if (newState !== oldState) {
            card.classList.remove('turning-on', 'turning-off');
            void card.offsetWidth;
            card.classList.add(newState ? 'turning-on' : 'turning-off');
          }

          statusEl.textContent = newState ? "ON" : "OFF";
          statusEl.className = "status " + (newState ? "on" : "off");
          btn.textContent = newState ? "WYŁĄCZ" : "WŁĄCZ";
          btn.className = newState ? "on" : "off";

          updateAllToggleButton();
        });

        btn.onclick = () => ref.get().then(s => ref.set(!s.val()));
      });

      function updateAllToggleButton() {
        const allOn = allStates.every(s => s);
        allToggleText.textContent = allOn ? "WYŁĄCZ WSZYSTKO" : "WŁĄCZ WSZYSTKO";
        allToggleBtn.querySelector('i').className = allOn ? "fas fa-power-off" : "fas fa-bolt";
        allToggleBtn.classList.toggle('all-on', allOn);
      }

      allToggleBtn.onclick = () => {
        const target = allStates.every(s => s) ? false : true;
        relays.forEach(r => db.ref("/" + r.path).set(target));
      };
    }

    document.getElementById("logoutBtn").onclick = () => {
      firebase.auth().signOut().then(() => {
        dashboard.style.display = "none";
        loginForm.style.display = "block";
        document.getElementById("email").value = "";
        document.getElementById("password").value = "";
      });
    };
  </script>
</body>
</html>
